name: Release

# Manual: Actions -> Release -> Run workflow. Builds the given version, runs the
# full test suite, then creates a git tag and a GitHub Release with the module
# jars attached. It does NOT commit a version bump to main -- the poms keep their
# -SNAPSHOT version and the release version is set only for the build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (no -SNAPSHOT)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
          # generates ~/.m2/settings.xml with a `central` server whose
          # credentials come from the env vars named below, and imports the
          # signing key so the `release` profile's maven-gpg-plugin can sign.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version (build only, not committed)
        run: mvn -B -q versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Full test suite (all groups, with SIMD)
        env:
          MAVEN_OPTS: --add-modules jdk.incubator.vector
        run: mvn -B clean verify -P mc

      - name: Package
        run: mvn -B -q package -DskipTests

      # Publishes -sources/-javadoc + signatures for every library module to the
      # Sonatype Central Portal. autoPublish is off in the `release` profile, so
      # this uploads and validates the bundle but leaves the final "Publish" as
      # a manual click at https://central.sonatype.com/publishing/deployments .
      # Runs before Tag so a Central rejection stops the release cleanly.
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -P release -DskipTests deploy

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -path '*/target/nablatensor-*.jar' \
            ! -name '*-tests.jar' ! -name 'original-*' -exec cp -v {} dist/ \;
          (cd dist && sha256sum *.jar | tee SHA256SUMS.txt)
          zip -j "nablatensor-${{ inputs.version }}-jars.zip" dist/*

      - name: Tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "NablaTensor ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: NablaTensor ${{ inputs.version }}
          generate_release_notes: true
          files: |
            nablatensor-${{ inputs.version }}-jars.zip
            dist/SHA256SUMS.txt
