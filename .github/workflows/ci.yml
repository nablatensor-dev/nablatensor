name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The bank-deployable path: green with no GPU, no native library and no
  # incubator flag. Default test run (the slow `mc` Monte-Carlo group excluded).
  clean-lts:
    name: mvn test (LTS clean path, JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B -q clean test

      - name: Install
        run: mvn -B -q install -DskipTests

  # The full suite: SIMD module enabled (jdk.incubator.vector) and the slow
  # closed-form-vs-Monte-Carlo validation group (`-P mc`) run as well.
  full:
    name: mvn test -P mc (full suite, JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build and test (all groups, with SIMD)
        env:
          MAVEN_OPTS: --add-modules jdk.incubator.vector
        run: mvn -B clean test -P mc

      - name: Install
        run: mvn -B -q install -DskipTests

      - name: Validation evidence pack (with SIMD)
        run: >
          MAVEN_OPTS="--add-modules jdk.incubator.vector"
          mvn -B -q -pl nablatensor-validate exec:java
          -Dexec.mainClass=com.nablatensor.validate.EvidenceMain
          -Dscenarios=500000 -Dsteps=64
